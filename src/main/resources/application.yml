server:
  port: ${PORT:8080}

spring:
  application:
    name: socialconnect-backend-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/socialconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:social_user}
    password: ${DB_PASSWORD:social_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: socialconnect-hikari
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:25}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:20000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
    placeholders:
      seed_data_enabled: ${DB_SEED_ENABLED:false}

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:socialconnect-assets}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# IAM-first credential resolution strategy:
# 1) ECS/EKS/EC2 role credentials
# 2) AWS_PROFILE
# 3) AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (local dev only)
